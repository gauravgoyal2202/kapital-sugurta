version: 2

models:

  # ─────────────────────────────────────────────────────────────
  # DIMENSION / MAPPING MODELS
  # ─────────────────────────────────────────────────────────────

  - name: curated_bank_partner_mapping
    description: >
      Maps each insurance application (anketa_id) to its bank partner.
      The bank is identified as the Beneficiary or Mortgagor on the policy.
    columns:
      - name: anketa_id
        description: "Primary key – unique insurance application identifier."
        tests:
          - not_null
          - unique
      - name: bank_partner_name
        description: "Resolved bank partner name (Beneficiary → Mortgagor → 'Direct/No Partner')."
        tests:
          - not_null
      - name: product_category
        description: "Priority area group: Motor, Banking, Property, or Other."
        tests:
          - not_null
          - accepted_values:
              values: ['Motor', 'Banking', 'Property', 'Other']

  - name: curated_priority_area_mapping
    description: >
      Groups products (pturi_id) and vertical classes into priority areas:
      Motor, Banking, Property, or Other.
    columns:
      - name: pturi_id
        description: "Unique product category ID from ins_pturi_oracle."
        tests:
          - not_null
          - unique
      - name: priority_area
        description: "High-level product priority area label."
        tests:
          - not_null
          - accepted_values:
              values: ['Motor', 'Banking', 'Property', 'Other']

  - name: curated_product_dimension
    description: "Standardized product dimensions enriched from ins_pturi_oracle and ins_vertical_oracle."
    columns:
      - name: pturi_id
        description: "Unique product identifier."
        tests:
          - not_null
          - unique
      - name: product_name
        description: "Human-readable product name."
        tests:
          - not_null
      - name: insurance_type
        description: "Type of insurance: Compulsory or Voluntary."
        tests:
          - not_null
          - accepted_values:
              values: ['Compulsory', 'Voluntary']

  - name: curated_channel_partner_dimension
    description: "Dimension table linking anketa_id to sales channel, agent, and partner info."
    columns:
      - name: anketa_id
        description: "Insurance application identifier (foreign key)."
        tests:
          - not_null
      - name: sales_channel
        description: "Classified sales channel."
        tests:
          - not_null
          - accepted_values:
              values: ['Website', 'API Partner', 'Banks', 'Marketplace', 'Agent Network', 'In-House']

  # ─────────────────────────────────────────────────────────────
  # PREMIUM / PAYMENT MODELS
  # ─────────────────────────────────────────────────────────────

  - name: curated_insurance_premium
    description: >
      Curated premium payment records combining voluntary (ins_oplata_oracle)
      and OSAGO (tb_oplata_oracle) payment flows. Grain: one row per payment transaction.
    columns:
      - name: payment_date
        description: "Date the premium payment was made."
        tests:
          - not_null
      - name: source_query_id
        description: "Identifier for the source query used (1 = voluntary, 21 = OSAGO liability, 22 = OSAGO premium)."
        tests:
          - not_null
          - accepted_values:
              values: [1, 21, 22]
      - name: anketa_id
        description: "Insurance application identifier."
        tests:
          - not_null
      - name: premium_amount
        description: "Premium amount in UZS. Must be non-negative."
        tests:
          - not_null
      - name: liability_amount
        description: "Liability (insured sum) in UZS. Must be non-negative."
        tests:
          - not_null

  - name: curated_agency_commissions
    description: >
      Commission transaction records combining voluntary and OSAGO policies.
      Grain: one row per commission payment transaction.
    columns:
      - name: transaction_id
        description: "Source transaction ID."
        tests:
          - not_null
      - name: anketa_id
        description: "Insurance application identifier."
        tests:
          - not_null
      - name: commission_date
        description: "Date the commission was paid."
        tests:
          - not_null
      - name: commission_amount_uzs
        description: "Commission amount in UZS."
        tests:
          - not_null
      - name: bank_partner_name
        description: "Resolved bank or partner name."
        tests:
          - not_null
      - name: product_category
        description: "Priority area (Motor, Banking, Property, Other)."
        tests:
          - not_null
          - accepted_values:
              values: ['Motor', 'Banking', 'Property', 'Other']

  - name: curated_sales_channels
    description: >
      Sales channel classification for each payment transaction.
      Combines channel label, agent metadata, premium and commission amounts.
    columns:
      - name: payment_date
        description: "Payment date."
        tests:
          - not_null
      - name: anketa_id
        description: "Insurance application ID."
        tests:
          - not_null
      - name: sales_channel
        description: "Classified sales channel."
        tests:
          - not_null
          - accepted_values:
              values: ['Website', 'API Partner', 'Marketplace', 'Banks', 'Agent Network', 'Branch Network']
      - name: channel_group
        description: "High-level channel group."
        tests:
          - not_null
          - accepted_values:
              values: ['Partner Channels', 'Agency Network', 'Own Channels']
      - name: insurance_type
        description: "Mandatory or Voluntary."
        tests:
          - not_null
          - accepted_values:
              values: ['Mandatory', 'Voluntary']
      - name: premium_amount
        description: "Premium amount in UZS."
        tests:
          - not_null
      - name: commission_amount
        description: "Commission amount in UZS."
        tests:
          - not_null

  # ─────────────────────────────────────────────────────────────
  # CLAIMS MODELS
  # ─────────────────────────────────────────────────────────────

  - name: curated_insurance_claims
    description: >
      Standardized claims payment records from Oracle ins_viplati table,
      linked to policies and product dimensions.
    columns:
      - name: payment_date
        description: "Date the claim was paid."
        tests:
          - not_null
      - name: viplati_id
        description: "Primary key from ins_viplati_oracle."
        tests:
          - not_null
          - unique
      - name: sobitie_id
        description: "Claim event ID (foreign key to ins_sobitie_oracle)."
        tests:
          - not_null
      - name: anketa_id
        description: "Insurance application ID."
        tests:
          - not_null
      - name: claim_amount
        description: "Claim payment amount in UZS (currency-converted)."
        tests:
          - not_null

  - name: curated_claims_portfolio
    description: >
      Combined historical (Excel) and 2026-onwards (Oracle) claims data.
      Used for financial ratio calculations.
    columns:
      - name: record_id
        description: "Claim record identifier."
        tests:
          - not_null
      - name: incident_date
        description: "Date of the insured incident."
      - name: payout_date
        description: "Date of the final claim payout."
      - name: payout_total
        description: "Total payout amount."
        tests:
          - not_null
      - name: scenario
        description: "Data scenario flag."
        tests:
          - not_null
          - accepted_values:
              values: ['Actual']

  - name: curated_claims_settlement
    description: >
      Measures claim settlement efficiency (days from event creation to final payout).
      Grain: one row per claim event (claim_event_id).
    columns:
      - name: claim_event_id
        description: "Primary key – unique claim event ID from ins_sobitie_oracle."
        tests:
          - not_null
          - unique
      - name: policy_anketa_id
        description: "Insurance application identifier."
        tests:
          - not_null
      - name: event_created_date
        description: "Date the claim event was opened."
        tests:
          - not_null
      - name: final_payout_date
        description: "Date of the final payout for this claim."
        tests:
          - not_null
      - name: report_month
        description: "First day of the month in which the final payout occurred."
        tests:
          - not_null
      - name: settlement_days
        description: "Number of days between event creation and final payout. Must be >= 0."
        tests:
          - not_null
      - name: insurance_type
        description: "Mandatory or Voluntary."
        tests:
          - not_null
          - accepted_values:
              values: ['Mandatory', 'Voluntary']
      - name: product_category
        description: "Vertical product category."
        tests:
          - not_null

  - name: curated_claims_2026_oracle
    description: "2026 onwards claims data sourced directly from Oracle ins_sobitie / ins_viplati."
    columns:
      - name: record_id
        description: "Claim record identifier."
        tests:
          - not_null
      - name: scenario
        description: "Scenario flag."
        tests:
          - not_null
          - accepted_values:
              values: ['Actual']

  # ─────────────────────────────────────────────────────────────
  # POLICY RENEWALS
  # ─────────────────────────────────────────────────────────────

  - name: curated_policy_renewals_base
    description: "Raw renewal spine from kontragent_report – extracted before the self-join logic."
    columns:
      - name: anketa_id
        description: "Insurance application identifier."
        tests:
          - not_null

  - name: curated_policy_renewals
    description: >
      One row per expiring policy, with a flag indicating whether the client renewed.
      Used for Dashboard 15 renewal rate calculations.
    columns:
      - name: old_anketa_id
        description: "Expiring policy application ID."
        tests:
          - not_null
          - unique
      - name: expiration_date
        description: "Policy expiration date."
        tests:
          - not_null
      - name: report_month
        description: "Month of policy expiration."
        tests:
          - not_null
      - name: client_id
        description: "Client identifier (rekvezid)."
        tests:
          - not_null
      - name: is_renewed
        description: "1 if the client renewed, 0 if not."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: insurance_type
        description: "Mandatory or Voluntary."
        tests:
          - not_null
          - accepted_values:
              values: ['Mandatory', 'Voluntary']

  # ─────────────────────────────────────────────────────────────
  # ACTIVE CUSTOMER PORTFOLIO
  # ─────────────────────────────────────────────────────────────

  - name: curated_active_customer_portfolio
    description: >
      Monthly spine of active policies and customers. Each row represents a policy
      that was active during the report_month. Used for retention and LTV calculations.
    columns:
      - name: report_month
        description: "First day of the month the policy was active."
        tests:
          - not_null
      - name: policy_id
        description: "Policy identifier from ins_polis_oracle."
        tests:
          - not_null
      - name: customer_id
        description: "Customer/owner identifier."
        tests:
          - not_null
      - name: exact_start_date
        description: "Policy coverage start date."
        tests:
          - not_null
      - name: exact_end_date
        description: "Policy coverage end date."
        tests:
          - not_null
      - name: legal_form
        description: "Physical or Juridical person."
        tests:
          - not_null
          - accepted_values:
              values: ['Physical', 'Juridical']
      - name: customer_segment
        description: "Retail or Corporate."
        tests:
          - not_null
          - accepted_values:
              values: ['Retail', 'Corporate']

  # ─────────────────────────────────────────────────────────────
  # SUBROGATION
  # ─────────────────────────────────────────────────────────────

  - name: curated_subrogation_recoveries
    description: >
      Subrogation recovery transactions from ins_bank_client_oracle (bc_type=2).
      Grain: one row per recovery payment transaction.
    columns:
      - name: transaction_id
        description: "Recovery transaction ID from ins_bank_client_oracle."
        tests:
          - not_null
          - unique
      - name: recovery_payment_date
        description: "Date the recovery payment was received."
        tests:
          - not_null
      - name: total_recovery_amount
        description: "Total recovery amount in UZS."
        tests:
          - not_null
      - name: exact_recovery_amount
        description: "Verified/linked recovery amount in UZS."
        tests:
          - not_null
      - name: undefined_recovery_amount
        description: "Unlinked/undefined recovery amount (total minus exact)."
        tests:
          - not_null
      - name: bank_partner_name
        description: "Associated bank partner name."
        tests:
          - not_null
      - name: product_category
        description: "Priority area product category."
        tests:
          - not_null

  # ─────────────────────────────────────────────────────────────
  # FINANCIAL PERFORMANCE (API)
  # ─────────────────────────────────────────────────────────────

  - name: curated_financial_performance
    description: >
      Parsed financial statement data from the API (financial_performance_api_response).
      Each row is one reporting date, with all F-code line items as columns.
    columns:
      - name: report_date
        description: "Financial reporting date."
        tests:
          - not_null
          - unique
      - name: scenario
        description: "Data scenario."
        tests:
          - not_null
          - accepted_values:
              values: ['Actual']
      - name: total_revenue
        description: "F010 – Total revenue."
        tests:
          - not_null
      - name: premium_income
        description: "F011 – Gross premium income."
        tests:
          - not_null
      - name: net_profit
        description: "F320 – Net profit/loss."
        tests:
          - not_null

  # ─────────────────────────────────────────────────────────────
  # INVESTMENT ACTIVITY (API)
  # ─────────────────────────────────────────────────────────────

  - name: curated_investment_activity
    description: >
      Parsed investment activity data from the API (investment_activity_api_response).
      Unpivoted to one row per investment instrument per reporting date.
    columns:
      - name: report_date
        description: "Investment activity reporting date."
        tests:
          - not_null
      - name: investment_type
        description: "Type of investment instrument."
        tests:
          - not_null
          - accepted_values:
              values: ['BOND', 'DEPOSIT', 'FX_DEPOSIT', 'LOAN', 'SHARE']
      - name: amount
        description: "Investment amount in UZS."
      - name: scenario
        description: "Scenario flag."
        tests:
          - not_null
          - accepted_values:
              values: ['Actual']

  # ─────────────────────────────────────────────────────────────
  # ORACLE DEPOSITS & LOANS
  # ─────────────────────────────────────────────────────────────

  - name: curated_oracle_deposits
    description: "Active deposit records from Oracle ins_invdep_oracle, enriched with partner name."
    columns:
      - name: deposit_type
        description: "Foreign Currency Deposits or Non-Foreign Currency Deposits."
        tests:
          - not_null
          - accepted_values:
              values: ['Foreign Currency Deposits', 'Non-Foreign Currency Deposits']
      - name: deposit_amount
        description: "Deposit principal amount."
        tests:
          - not_null
      - name: deposit_start_date
        description: "Deposit start date."
        tests:
          - not_null
      - name: scenario
        description: "Scenario flag."
        tests:
          - not_null
          - accepted_values:
              values: ['Actual']

  - name: curated_oracle_loans
    description: "Loan records from Oracle ins_invloan_oracle, enriched with client name and computed metrics."
    columns:
      - name: loan_id
        description: "Primary key – unique loan ID."
        tests:
          - not_null
          - unique
      - name: loan_amount
        description: "Original loan principal amount."
        tests:
          - not_null
      - name: loan_start_date
        description: "Loan disbursement date."
        tests:
          - not_null
      - name: loan_status
        description: "Loan status in Russian (Актив, Исполненный, Досрочное погашение)."
        tests:
          - not_null
      - name: scenario
        description: "Scenario flag."
        tests:
          - not_null
          - accepted_values:
              values: ['Actual']

  # ─────────────────────────────────────────────────────────────
  # SOLVENCY
  # ─────────────────────────────────────────────────────────────

  - name: curated_solvency_adequacy_ratio
    description: "Solvency margin adequacy ratios loaded from Excel/CSV."
    columns:
      - name: report_date
        description: "Reporting date for the solvency ratio."
        tests:
          - not_null
      - name: actual_solvency_margin_adequacy_ratio
        description: "Actual solvency margin adequacy ratio."
        tests:
          - not_null
      - name: required_solvency_margin_adequacy_ratio
        description: "Required solvency margin adequacy ratio."
        tests:
          - not_null
      - name: scenario
        description: "Scenario flag."
        tests:
          - not_null
          - accepted_values:
              values: ['Actual']

  # ─────────────────────────────────────────────────────────────
  # NPS
  # ─────────────────────────────────────────────────────────────

  - name: curated_nps_survey
    description: >
      Standardized NPS survey responses from Bitrix/Google Form.
      Each row is one survey response, categorized as Promoter, Passive, or Detractor.
    columns:
      - name: response_timestamp
        description: "Timestamp of the survey response."
        tests:
          - not_null
      - name: report_month
        description: "Month of the response (truncated to first of month)."
        tests:
          - not_null
      - name: nps_score_raw
        description: "Raw NPS score (typically 1–10)."
        tests:
          - not_null
      - name: nps_category
        description: "Promoter (>=9), Passive (>=7), Detractor (<7)."
        tests:
          - not_null
          - accepted_values:
              values: ['Promoter', 'Passive', 'Detractor']
      - name: nps_weight
        description: "Score weight: 1 for Promoter, 0 for Passive, -1 for Detractor."
        tests:
          - not_null
          - accepted_values:
              values: [-1, 0, 1]
      - name: survey_type
        description: "Type of survey (e.g. General NPS)."
        tests:
          - not_null

  # ─────────────────────────────────────────────────────────────
  # TERMINATED CONTRACTS
  # ─────────────────────────────────────────────────────────────

  - name: curated_terminated_contracts
    description: >
      Terminated/cancelled contracts from ins_rastorg_oracle,
      enriched with product key (pturi_id) and anketa_id for downstream joins.
    columns:
      - name: termination_date
        description: "Date the contract was terminated."
        tests:
          - not_null
      - name: terminated_amount
        description: "Contract value at termination (tb_summa)."
        tests:
          - not_null
      - name: returned_amount
        description: "Amount returned to the policyholder."
        tests:
          - not_null
      - name: remainder_amount
        description: "Remaining balance after return."
        tests:
          - not_null
      - name: anketa_id
        description: "Insurance application ID (from ins_polis_oracle.tb_anketa)."

  # ─────────────────────────────────────────────────────────────
  # REINSURANCE
  # ─────────────────────────────────────────────────────────────

  - name: curated_reinsurance_outgoing_portfolio
    description: >
      Outgoing reinsurance portfolio combining Excel historical data and Oracle records.
      Grain: one row per reinsurance transaction.
    columns:
      - name: id
        description: "Reinsurance transaction identifier."
        tests:
          - not_null
      - name: insurance_type
        description: "Type of insurance product."
      - name: policyholder
        description: "Policyholder (cedant) name."
      - name: premium_accrual_date
        description: "Premium accrual date for this reinsurance transaction."
      - name: total_accrued_premium_uzs
        description: "Total accrued premium in UZS."
        tests:
          - not_null
      - name: reinsurer
        description: "Reinsurer name."
      - name: source_system
        description: "Source system (Excel or Oracle)."
        tests:
          - not_null
          - accepted_values:
              values: ['Excel', 'Oracle']
      - name: scenario
        description: "Scenario flag."
        tests:
          - not_null
          - accepted_values:
              values: ['Actual']

  - name: curated_reinsurance_incoming_portfolio
    description: "Incoming reinsurance portfolio from Excel historical data."
    columns:
      - name: scenario
        description: "Scenario flag."
        tests:
          - not_null
          - accepted_values:
              values: ['Actual']